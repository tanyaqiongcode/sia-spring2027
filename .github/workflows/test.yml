name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Run unit & static tests
        run: python -m unittest discover -s tests -v

      - name: core.js 与雅思站同源校验（两站约定字节级同源，分叉即红）
        run: |
          mine=$(shasum -a 256 assets/core.js | cut -d' ' -f1)
          theirs=$(curl -fsSL https://raw.githubusercontent.com/tanyaqiongcode/ielts-listen-speak-7plus/main/assets/core.js | shasum -a 256 | cut -d' ' -f1)
          if [ "$mine" != "$theirs" ]; then
            echo "::error::assets/core.js 与 ielts-listen-speak-7plus 出现分叉。两站约定 core.js 字节级同源复用，请先比对两份文件、对齐后再合并。"
            exit 1
          fi
          echo "core.js 同源校验通过（sha256 一致）"
